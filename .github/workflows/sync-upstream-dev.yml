name: sync upstream dev

on:
  schedule:
    - cron: "*/30 * * * *" # alle 30 Minuten
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/<OFFIZIELLES_ORG_ODER_USER>/opencode.git
          git fetch upstream dev

      - name: Merge upstream/dev into dev
        run: |
          git checkout dev
          git merge --no-edit upstream/dev || {
            echo "Merge conflict detected, aborting."
            git merge --abort
            exit 1
          }

      - name: Push changes
        run: git push origin dev
